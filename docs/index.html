<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산기</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
    <div class="w-full max-w-[320px] bg-white rounded-2xl p-6 shadow-lg">
        <input type="text" id="display" readonly
            class="w-full h-14 mb-5 px-4 text-right text-3xl font-light text-gray-800 bg-gray-50 rounded-xl border-b-2 border-indigo-500 outline-none"
            placeholder="0">
        <div class="grid grid-cols-4 gap-2">
            <button onclick="clearDisplay()"
                class="h-14 text-lg font-semibold rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-600 active:scale-95 transition-all duration-150">C</button>
            <button onclick="setOperator('/')"
                class="h-14 text-lg font-semibold rounded-xl bg-indigo-100 hover:bg-indigo-200 text-indigo-700 active:scale-95 transition-all duration-150">÷</button>
            <button onclick="setOperator('*')"
                class="h-14 text-lg font-semibold rounded-xl bg-indigo-100 hover:bg-indigo-200 text-indigo-700 active:scale-95 transition-all duration-150">×</button>
            <button onclick="setOperator('-')"
                class="h-14 text-lg font-semibold rounded-xl bg-indigo-100 hover:bg-indigo-200 text-indigo-700 active:scale-95 transition-all duration-150">−</button>

            <button onclick="appendValue('7')"
                class="h-14 text-lg font-medium rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 active:scale-95 transition-all duration-150">7</button>
            <button onclick="appendValue('8')"
                class="h-14 text-lg font-medium rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 active:scale-95 transition-all duration-150">8</button>
            <button onclick="appendValue('9')"
                class="h-14 text-lg font-medium rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 active:scale-95 transition-all duration-150">9</button>
            <button onclick="setOperator('+')"
                class="h-14 text-lg font-semibold rounded-xl bg-indigo-100 hover:bg-indigo-200 text-indigo-700 active:scale-95 transition-all duration-150">+</button>

            <button onclick="appendValue('4')"
                class="h-14 text-lg font-medium rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 active:scale-95 transition-all duration-150">4</button>
            <button onclick="appendValue('5')"
                class="h-14 text-lg font-medium rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 active:scale-95 transition-all duration-150">5</button>
            <button onclick="appendValue('6')"
                class="h-14 text-lg font-medium rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 active:scale-95 transition-all duration-150">6</button>
            <button onclick="appendValue('.')"
                class="h-14 text-lg font-medium rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 active:scale-95 transition-all duration-150">.</button>

            <button onclick="appendValue('1')"
                class="h-14 text-lg font-medium rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 active:scale-95 transition-all duration-150">1</button>
            <button onclick="appendValue('2')"
                class="h-14 text-lg font-medium rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 active:scale-95 transition-all duration-150">2</button>
            <button onclick="appendValue('3')"
                class="h-14 text-lg font-medium rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 active:scale-95 transition-all duration-150">3</button>
            <button onclick="calculate()"
                class="h-14 text-xl font-bold rounded-xl bg-indigo-500 hover:bg-indigo-600 text-white shadow-md active:scale-95 transition-all duration-150">=</button>

            <button onclick="appendValue('0')"
                class="col-span-2 h-14 text-lg font-medium rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 active:scale-95 transition-all duration-150">0</button>
            <button onclick="backspace()"
                class="h-14 text-xl font-medium rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 active:scale-95 transition-all duration-150">⌫</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
